name: "Terraform infra workflow"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      destroy:
        required: true
        type: boolean
      apply:
        required: true
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      RABBITMQ_USER:
        required: true
      RABBITMQ_PASSWORD:
        required: true
      DEPLOY_PUBLIC_KEY:
        required: true
      DB_USERNAME:
        required: true
      DB_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      MAIL_HOST:
        required: true
      MAIL_PORT:
        required: true
      MAIL_USERNAME:
        required: true
      MAIL_PASSWORD:
        required: true
      GH_PAT:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: true
    outputs:
      rabbitmq_ip: ${{ steps.outputs.outputs.rabbitmq_ip }}
      frontend_public_ip: ${{ steps.outputs.outputs.frontend_public_ip }}
      backend_private_ip: ${{ steps.outputs.outputs.backend_private_ip }}
      database_private_ip: ${{ steps.outputs.outputs.database_private_ip }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: 1.8.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform init
        run: cd infra && terraform init

      - name: Terraform validate
        run: cd infra && terraform validate

      - name: Terraform destroy
        if: ${{ inputs.destroy == true }}
        id: terraform-destroy
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform destroy \
            -var-file="./environments/${{ inputs.environment }}/terraform.tfvars" \
            -var="rabbitmq_user=${{ secrets.RABBITMQ_USER }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -var="deploy_public_key=${{ secrets.DEPLOY_PUBLIC_KEY }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="mail_host=${{ secrets.MAIL_HOST }}" \
            -var="mail_port=${{ secrets.MAIL_PORT }}" \
            -var="mail_username=${{ secrets.MAIL_USERNAME }}" \
            -var="mail_password=${{ secrets.MAIL_PASSWORD }}" \
            -auto-approve

      - name: Terraform plan
        if: ${{ !inputs.destroy }}
        id: terraform-plan
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform plan \
            -var-file="./environments/${{ inputs.environment }}/terraform.tfvars" \
            -var="rabbitmq_user=${{ secrets.RABBITMQ_USER }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -var="deploy_public_key=${{ secrets.DEPLOY_PUBLIC_KEY }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="mail_host=${{ secrets.MAIL_HOST }}" \
            -var="mail_port=${{ secrets.MAIL_PORT }}" \
            -var="mail_username=${{ secrets.MAIL_USERNAME }}" \
            -var="mail_password=${{ secrets.MAIL_PASSWORD }}" \
            -out="${{ inputs.environment }}.plan"

      - name: Terraform apply
        if: ${{ !inputs.destroy && inputs.apply }}
        id: terraform-apply
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform apply "${{ inputs.environment }}.plan"

      - name: Get Terraform Outputs
        id: outputs
        if: ${{ !inputs.destroy && inputs.apply }}
        run: |
          cd infra
          echo "rabbitmq_ip=$(terraform output -raw rabbitmq_private_ip)" >> $GITHUB_OUTPUT
          echo "frontend_public_ip=$(terraform output -raw frontend_public_ip)" >> $GITHUB_OUTPUT
          echo "backend_private_ip=$(terraform output -raw backend_private_ip)" >> $GITHUB_OUTPUT
          echo "database_private_ip=$(terraform output -raw database_private_ip)" >> $GITHUB_OUTPUT
          echo "backend_instance_id=$(terraform output -raw backend_instance_id)" >> $GITHUB_OUTPUT
          echo "frontend_instance_id=$(terraform output -raw frontend_instance_id)" >> $GITHUB_OUTPUT

      - name: Configure frontend nginx via SSM
        if: ${{ !inputs.destroy && inputs.apply }}
        env:
          FRONTEND_INSTANCE_ID: ${{ steps.outputs.outputs.frontend_instance_id }}
          BACKEND_PRIVATE_IP: ${{ steps.outputs.outputs.backend_private_ip }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$FRONTEND_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Configure frontend nginx" \
            --timeout-seconds 180 \
            --parameters 'commands=[
              "set -e",
              "curl -fsSL -H '\''Authorization: token ${{ secrets.GH_PAT }}'\'' -H '\''Accept: application/vnd.github.v3.raw'\'' https://api.github.com/repos/undercontroll-inc/infra/contents/nginx/frontend.conf -o /tmp/frontend.conf",
              "sed -i '\''s|${BACKEND_PRIVATE_IP}|${{ env.BACKEND_PRIVATE_IP }}|g'\'' /tmp/frontend.conf",
              "cp /tmp/frontend.conf /etc/nginx/conf.d/default.conf",
              "nginx -t",
              "nginx -s reload"
            ]' \
            --region "${{ inputs.aws-region }}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$FRONTEND_INSTANCE_ID" \
            --region "${{ inputs.aws-region }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$FRONTEND_INSTANCE_ID" \
            --region "${{ inputs.aws-region }}" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Frontend nginx configuration failed with status: $STATUS" >&2
            exit 1
          fi

      - name: Sync variables to frontend repo
        if: ${{ !inputs.destroy && inputs.apply }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FRONTEND_PUBLIC_IP: ${{ steps.outputs.outputs.frontend_public_ip }}
          BACKEND_PRIVATE_IP: ${{ steps.outputs.outputs.backend_private_ip }}
        run: |
          gh variable set EC2_HOST \
            --repo undercontroll-inc/frontend \
            --body "${FRONTEND_PUBLIC_IP}"

          gh variable set VITE_API_URL \
            --repo undercontroll-inc/frontend \
            --body "/v1/api"

          gh variable set BACKEND_PRIVATE_IP \
            --repo undercontroll-inc/frontend \
            --body "${BACKEND_PRIVATE_IP}"

      - name: Sync variables to organization
        if: ${{ !inputs.destroy && inputs.apply }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FRONTEND_PUBLIC_IP: ${{ steps.outputs.outputs.frontend_public_ip }}
          BACKEND_PRIVATE_IP: ${{ steps.outputs.outputs.backend_private_ip }}
          RABBITMQ_IP: ${{ steps.outputs.outputs.rabbitmq_ip }}
          DATABASE_PRIVATE_IP: ${{ steps.outputs.outputs.database_private_ip }}
          BACKEND_INSTANCE_ID: ${{ steps.outputs.outputs.backend_instance_id }}
          FRONTEND_INSTANCE_ID: ${{ steps.outputs.outputs.frontend_instance_id }}
        run: |
          gh variable set RABBITMQ_HOST \
            --org undercontroll-inc \
            --body "${RABBITMQ_IP}"

          gh variable set DB_HOST \
            --org undercontroll-inc \
            --body "${DATABASE_PRIVATE_IP}"

          gh variable set BACKEND_EC2_HOST \
            --org undercontroll-inc \
            --body "${BACKEND_PRIVATE_IP}"

          gh variable set BASTION_HOST \
            --org undercontroll-inc \
            --body "${FRONTEND_PUBLIC_IP}"

          # gh secret set FRONTEND_BUCKET_NAME \
          #   --org undercontroll-inc --visibility all \
          #   --body "${FRONTEND_BUCKET_NAME}"

          # gh secret set CLOUDFRONT_DOMAIN_NAME \
          #   --org undercontroll-inc --visibility all \
          #   --body "${CLOUDFRONT_DOMAIN_NAME}"

          # gh secret set CLOUDFRONT_DISTRIBUTION_ID \
          #   --org undercontroll-inc --visibility all \
          #   --body "${CLOUDFRONT_DISTRIBUTION_ID}"

          gh variable set BACKEND_INSTANCE_ID \
             --org undercontroll-inc \
             --body "${BACKEND_INSTANCE_ID}"

          gh variable set FRONTEND_INSTANCE_ID \
            --org undercontroll-inc \
            --body "${FRONTEND_INSTANCE_ID}"
