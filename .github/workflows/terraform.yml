name: "Terraform infra workflow"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      destroy:
        required: true
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      RABBITMQ_USER:
        required: true
      RABBITMQ_PASSWORD:
        required: true
      DEPLOY_PUBLIC_KEY:
        required: true
      GH_PAT:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      rabbitmq_ip: ${{ steps.outputs.outputs.rabbitmq_ip }}
      frontend_public_ip: ${{ steps.outputs.outputs.frontend_public_ip }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: 1.8.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform init
        run: cd infra && terraform init

      - name: Terraform validate
        run: cd infra && terraform validate

      - name: Terraform destroy
        if: ${{ inputs.destroy == true }}
        id: terraform-destroy
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform destroy \
            -var-file="./environments/${{ inputs.environment }}/terraform.tfvars" \
            -var="rabbitmq_user=${{ secrets.RABBITMQ_USER }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -var="deploy_public_key=${{ secrets.DEPLOY_PUBLIC_KEY }}" \
            -auto-approve

      - name: Terraform plan
        if: ${{ !inputs.destroy }}
        id: terraform-plan
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform plan \
            -var-file="./environments/${{ inputs.environment }}/terraform.tfvars" \
            -var="rabbitmq_user=${{ secrets.RABBITMQ_USER }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -var="deploy_public_key=${{ secrets.DEPLOY_PUBLIC_KEY }}" \
            -out="${{ inputs.environment }}.plan"

      - name: Terraform apply
        if: ${{ !inputs.destroy }}
        id: terraform-apply
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform apply "${{ inputs.environment }}.plan"

      - name: Get Terraform Outputs
        id: outputs
        if: ${{ !inputs.destroy }}
        run: |
          cd infra
          RABBITMQ_IP=$(terraform output -raw rabbitmq_private_ip)
          FRONTEND_PUBLIC_IP=$(terraform output -raw frontend_public_ip)
          echo "rabbitmq_ip=${RABBITMQ_IP}" >> $GITHUB_OUTPUT
          echo "frontend_public_ip=${FRONTEND_PUBLIC_IP}" >> $GITHUB_OUTPUT

      - name: Sync secrets to frontend repo
        if: ${{ !inputs.destroy }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FRONTEND_PUBLIC_IP: ${{ steps.outputs.outputs.frontend_public_ip }}
        run: |
          # EC2_HOST: updated every apply so the frontend CD always deploys to the correct IP
          gh secret set EC2_HOST \
            --repo undercontroll-inc/frontend \
            --body "${FRONTEND_PUBLIC_IP}"

          # VITE_API_URL: relative path — browser calls same origin, nginx proxies to backend
          gh secret set VITE_API_URL \
            --repo undercontroll-inc/frontend \
            --body "/v1/api"

          # Uncomment when the backend EC2 is added to Terraform:
          # BACKEND_PRIVATE_IP=$(terraform output -raw backend_private_ip -chdir=infra)
          # gh secret set BACKEND_PRIVATE_IP \
          #   --repo undercontroll-inc/frontend \
          #   --body "${BACKEND_PRIVATE_IP}"
