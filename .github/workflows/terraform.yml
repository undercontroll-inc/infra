name: "Terraform infra workflow"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      destroy:
        required: true
        type: boolean
      apply:
        required: true
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      RABBITMQ_USER:
        required: true
      RABBITMQ_PASSWORD:
        required: true
      REDIS_USERNAME:
        required: true
      REDIS_PASSWORD:
        required: true
      DEPLOY_PUBLIC_KEY:
        required: true
      DB_USERNAME:
        required: true
      DB_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      MAIL_HOST:
        required: true
      MAIL_PORT:
        required: true
      MAIL_USERNAME:
        required: true
      MAIL_PASSWORD:
        required: true
      GH_PAT:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: true
    outputs:
      rabbitmq_ip: ${{ steps.outputs.outputs.rabbitmq_ip }}
      alb_public_ip: ${{ steps.outputs.outputs.alb_public_ip }}
      core_ip_1: ${{ steps.outputs.outputs.core_ip_1 }}
      core_ip_2: ${{ steps.outputs.outputs.core_ip_2 }}
      notification_ip: ${{ steps.outputs.outputs.notification_ip }}
      database_private_ip: ${{ steps.outputs.outputs.database_private_ip }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: 1.8.3
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform init
        run: cd infra && terraform init

      - name: Terraform validate
        run: cd infra && terraform validate

      - name: Terraform destroy
        if: ${{ inputs.destroy == true }}
        id: terraform-destroy
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform destroy \
            -var-file="./environments/${{ inputs.environment }}/terraform.tfvars" \
            -var="rabbitmq_user=${{ secrets.RABBITMQ_USER }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -var="redis_username=${{ secrets.REDIS_USERNAME }}" \
            -var="redis_password=${{ secrets.REDIS_PASSWORD }}" \
            -var="deploy_public_key=${{ secrets.DEPLOY_PUBLIC_KEY }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="mail_host=${{ secrets.MAIL_HOST }}" \
            -var="mail_port=${{ secrets.MAIL_PORT }}" \
            -var="mail_username=${{ secrets.MAIL_USERNAME }}" \
            -var="mail_password=${{ secrets.MAIL_PASSWORD }}" \
            -auto-approve

      - name: Terraform plan
        if: ${{ !inputs.destroy }}
        id: terraform-plan
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform plan \
            -var-file="./environments/${{ inputs.environment }}/terraform.tfvars" \
            -var="rabbitmq_user=${{ secrets.RABBITMQ_USER }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -var="deploy_public_key=${{ secrets.DEPLOY_PUBLIC_KEY }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="redis_username=${{ secrets.REDIS_USERNAME }}" \
            -var="redis_password=${{ secrets.REDIS_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="mail_host=${{ secrets.MAIL_HOST }}" \
            -var="mail_port=${{ secrets.MAIL_PORT }}" \
            -var="mail_username=${{ secrets.MAIL_USERNAME }}" \
            -var="mail_password=${{ secrets.MAIL_PASSWORD }}" \
            -out="${{ inputs.environment }}.plan"

      - name: Terraform apply
        if: ${{ !inputs.destroy && inputs.apply }}
        id: terraform-apply
        run: |
          cd infra &&
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
          terraform apply "${{ inputs.environment }}.plan"

      - name: Get Terraform outputs
        id: outputs
        if: ${{ !inputs.destroy && inputs.apply }}
        run: |
          cd infra
          CORE_IPS=$(terraform output -json core_private_ips)
          echo "rabbitmq_ip=$(terraform output -raw rabbitmq_private_ip)" >> $GITHUB_OUTPUT
          echo "alb_public_ip=$(terraform output -raw alb_public_ip)" >> $GITHUB_OUTPUT
          echo "core_ip_1=$(echo "$CORE_IPS" | jq -r '.[0]')" >> $GITHUB_OUTPUT
          echo "core_ip_2=$(echo "$CORE_IPS" | jq -r '.[1]')" >> $GITHUB_OUTPUT
          echo "notification_ip=$(terraform output -raw notification_private_ip)" >> $GITHUB_OUTPUT
          echo "database_private_ip=$(terraform output -raw database_private_ip)" >> $GITHUB_OUTPUT
          echo "observability_public_ip=$(terraform output -raw observability_public_ip)" >> $GITHUB_OUTPUT

      - name: Sync variables to organization
        if: ${{ !inputs.destroy && inputs.apply }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALB_PUBLIC_IP: ${{ steps.outputs.outputs.alb_public_ip }}
          CORE_IP_1: ${{ steps.outputs.outputs.core_ip_1 }}
          CORE_IP_2: ${{ steps.outputs.outputs.core_ip_2 }}
          NOTIFICATION_IP: ${{ steps.outputs.outputs.notification_ip }}
          RABBITMQ_IP: ${{ steps.outputs.outputs.rabbitmq_ip }}
          DATABASE_PRIVATE_IP: ${{ steps.outputs.outputs.database_private_ip }}
          OBSERVABILITY_PUBLIC_IP: ${{ steps.outputs.outputs.observability_public_ip }}
        run: |
          gh variable set BASTION_HOST \
            --org undercontroll-inc \
            --visibility all \
            --body "${ALB_PUBLIC_IP}"

          gh variable set BACKEND_EC2_HOST_1 \
            --org undercontroll-inc \
            --visibility all \
            --body "${CORE_IP_1}"

          gh variable set BACKEND_EC2_HOST_2 \
            --org undercontroll-inc \
            --visibility all \
            --body "${CORE_IP_2}"

          gh variable set BACKEND_EC2_HOST \
            --org undercontroll-inc \
            --visibility all \
            --body "${CORE_IP_1}"

          gh variable set NOTIFICATION_EC2_HOST \
            --org undercontroll-inc \
            --visibility all \
            --body "${NOTIFICATION_IP}"

          gh variable set RABBITMQ_HOST \
            --org undercontroll-inc \
            --visibility all \
            --body "${RABBITMQ_IP}"

          # Redis roda na mesma services_instance que o RabbitMQ
          gh variable set REDIS_HOST \
            --org undercontroll-inc \
            --visibility all \
            --body "${RABBITMQ_IP}"

          gh variable set DB_HOST \
            --org undercontroll-inc \
            --visibility all \
            --body "${DATABASE_PRIVATE_IP}"
